# Candidate-only regression. No DB connection, publisher requests, writes or deploy.
name: DoctorPet Vet News R6.3 Title Encoding Preflight
on:
  push:
    branches: [team3-vet-news-r4-staging-20261108]
    paths:
      - .github/workflows/doctorpet-vet-news-r63-encoding.yml
      - vet-news/staging/r63-title-encoding-collector-preflight.cjs
      - vet-news/staging/r63-title-encoding-collector-preflight.test.cjs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/doctorpet-vet-news-r63-encoding.yml
      - vet-news/staging/r63-title-encoding-collector-preflight.cjs
      - vet-news/staging/r63-title-encoding-collector-preflight.test.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-title-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout review branch only
        uses: actions/checkout@v4
      - name: Test fail-closed title quality under synthetic 200 and 304
        shell: bash
        run: |
          node --test vet-news/staging/r63-title-encoding-collector-preflight.test.cjs
      - name: Confirm no persistent changes
        shell: bash
        run: |
          git diff --exit-code
          echo "R6.3 quality preflight candidate: no DB/cron/production mutations"
