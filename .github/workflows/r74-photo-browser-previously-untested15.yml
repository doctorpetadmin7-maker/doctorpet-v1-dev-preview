name: R7.4 last fifteen photo URLs browser verification
on:
  push:
    branches: [team3-r72-dailyvet-10-og-review-20261109]
    paths:
      - .github/workflows/r74-photo-browser-previously-untested15.yml
      - vet-news/staging/r74_existing15_photo_browser_qa.py
permissions:
  contents: read
jobs:
  last-15-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout isolated review
        uses: actions/checkout@v4
      - name: Decode only previously untested 13 DailyVet and 2 News1 image URLs
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then python3 -m playwright install chromium; fi
          python3 vet-news/staging/r74_existing15_photo_browser_qa.py
      - name: Store only status JSON, not photos
        uses: actions/upload-artifact@v4
        with:
          name: r74-last15-photo-browser-proof
          path: r74-existing15-browser-verification.json
          retention-days: 2
          if-no-files-found: error
