name: R7.3 new 14 DailyGaewon images browser decode
on:
  push:
    branches: [team3-r72-dailyvet-10-og-review-20261109]
    paths:
      - .github/workflows/r73-browser-14-new-dailygaewon.yml
      - vet-news/staging/r73_verify_14_new_photos_browser.py
permissions:
  contents: read
  actions: read
jobs:
  exact-14-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout isolated review
        uses: actions/checkout@v4
      - name: Reuse existing R7.3 photo URL manifest; do not fetch articles again
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42576026658 --repo doctorpetadmin7-maker/doctorpet-v1-dev-preview \
            --name r73-new14-dailygaewon-photo-url-metadata --dir r73-metadata
      - name: Decode only 14 NEW image URLs, no files or public write
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then python3 -m playwright install chromium; fi
          python3 vet-news/staging/r73_verify_14_new_photos_browser.py
      - name: Retain image decode status JSON, not image bytes
        uses: actions/upload-artifact@v4
        with:
          name: r73-14-new-dailygaewon-image-decode-status
          path: r73-dailygaewon-14-image-decoding.json
          retention-days: 2
          if-no-files-found: error
