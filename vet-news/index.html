<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>닥터펫 수의계 뉴스 · DEV</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#17324d;background:#f5f8fb;--b:#dbe5ef;--blue:#1463d6;--green:#16845b;--muted:#6b7b8c}
*{box-sizing:border-box}body{margin:0}a{color:inherit}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--b);padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:20px;margin:4px 8px 22px}.nav a{display:block;text-decoration:none;padding:11px 12px;border-radius:9px;margin:3px 0;color:#334e68}.nav a.active{background:#eaf2ff;color:#0b56c2;font-weight:800}.main{padding:24px 28px 60px;min-width:0}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.head h1{margin:0 0 6px;font-size:28px}.head p{margin:0;color:var(--muted)}.pill{display:inline-block;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800}.pill.dev{background:#e6f4ee;color:#087653}.notice{margin:20px 0;background:#fff;border:1px solid var(--b);border-radius:12px;padding:14px 16px;color:#536577;font-size:14px}.media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}.media-card{background:#fff;border:1px solid var(--b);border-radius:16px;padding:20px;text-decoration:none;min-height:210px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(16,24,40,.03)}.media-card:hover{border-color:#9bbbea}.media-card h2{margin:0;font-size:21px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#f7f9fc;border-radius:10px;padding:10px}.stat b{display:block;font-size:20px}.stat small{color:var(--muted)}.statusline{margin-top:auto;font-size:13px;color:var(--muted)}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#98a2b3}.status-dot.good{background:#20a66a}.status-dot.bad{background:#e04f5f}.status-dot.warn{background:#e7a72d}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}.back{border:1px solid var(--b);background:#fff;border-radius:9px;padding:9px 12px;text-decoration:none}.source-title{font-weight:900;font-size:22px;margin-right:auto}.statebox{background:#fff;border:1px solid var(--b);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#536577}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.article{display:grid;grid-template-columns:126px 1fr;background:#fff;border:1px solid var(--b);border-radius:14px;overflow:hidden;text-decoration:none;min-height:150px}.article:hover{border-color:#9bbbea}.photo{background:#eef3f7;display:grid;place-items:center;color:#91a0af;font-size:12px;text-align:center;padding:10px}.photo img{width:100%;height:100%;object-fit:cover}.article-body{padding:14px 16px;min-width:0}.meta{display:flex;justify-content:space-between;gap:10px;color:#728195;font-size:12px}.article h3{margin:10px 0 8px;font-size:16px;line-height:1.45}.excerpt{min-height:38px;color:#5d6d7e;font-size:13px;line-height:1.5;margin:0 0 9px}.excerpt:empty{visibility:hidden}.flags{display:flex;gap:6px;flex-wrap:wrap}.flag{font-size:11px;border-radius:99px;padding:4px 7px;background:#f0f3f6;color:#687789}.flag.actual{background:#e7f6ef;color:#087653}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:24px 0}.pager button{border:1px solid var(--b);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.pager button:disabled{opacity:.4;cursor:default}.empty{background:#fff;border:1px solid var(--b);border-radius:12px;padding:30px;color:#687789}.mobile-menu{display:none}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:16px 14px 40px}.mobile-menu{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.mobile-menu a{white-space:nowrap;border:1px solid var(--b);background:#fff;border-radius:9px;padding:8px 10px;text-decoration:none}.media-grid{grid-template-columns:1fr}.list{grid-template-columns:1fr}.article{grid-template-columns:105px 1fr}}
@media(max-width:520px){.head{display:block}.article{grid-template-columns:86px 1fr}.photo{font-size:11px}.article h3{font-size:15px}.main{padding-left:10px;padding-right:10px}}
</style></head><body>
<div class="shell"><aside class="side"><div class="brand">닥터펫</div><nav class="nav">
<a href="../">DEV 홈으로 돌아가기</a><a class="active" href="./">닥터펫 수의계 뉴스</a>
</nav></aside><main class="main">
<div class="mobile-menu"><a href="../">홈</a><a href="./">닥터펫 수의계 뉴스</a></div>
<div class="head"><div><span class="pill dev">DEV · 별도 메뉴</span><h1>닥터펫 수의계 뉴스</h1><p>기존 수의통합관·학회·논문은 유지하고, 국내 수의계 뉴스만 별도로 확인합니다.</p></div></div>
<div class="notice"><b>콘텐츠 표시 기준</b> · 실제 저장과 300건 참고 후보를 구분합니다. 사진·기사 소개글은 매체별 이용 허가가 확인된 경우에만 본문 슬롯에 표시합니다. 현재 세 매체는 승인 근거가 확인되지 않아 사진·소개글을 노출하지 않습니다.</div>
<div id="app"><div class="empty">DEV 뉴스 상태를 불러오는 중입니다.</div></div>
</main></div>
<script>
const API='https://mabvxdcpmfdzrqlgkxqn.supabase.co/functions/v1/doctorpet-vet-news-release-data';
const sources={
 FEED_DAILYGAEWON:{slug:'dailygaewon',name:'데일리개원'},
 REF_DAILYVET:{slug:'dailyvet',name:'데일리벳'},
 REF_HAPPYPET:{slug:'happypet',name:'뉴스1 해피펫'}
};
const bySlug=Object.fromEntries(Object.entries(sources).map(([id,v])=>[v.slug,id]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kdate=v=>{if(!v)return '게시일 확인 중';const d=new Date(v);if(!Number.isFinite(d.getTime()))return '게시일 확인 중';return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)};
const kdt=v=>{if(!v)return '없음';const d=new Date(v);if(!Number.isFinite(d.getTime()))return '없음';return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d)};
const statusInfo=s=>{if(!s)return['warn','상태 미확인'];if(s.collectorStatus==='SUCCESS')return['good','정상 확인'];if(s.collectorStatus==='FAILED')return['bad','수집 오류'];if(s.collectorStatus==='NO_AUTOMATIC_COLLECTOR')return['warn','자동수집 미연결'];return['warn',s.collectorStatus||'상태 미확인']};
let data=null;
function home(){
 const cards=Object.entries(sources).map(([id,m])=>{const st=data.states[id]||{};const [cl,txt]=statusInfo(st);return `<a class="media-card" href="?source=${m.slug}"><h2>${m.name}</h2><div class="stats"><div class="stat"><b>${st.actualCount??0}</b><small>실제 저장</small></div><div class="stat"><b>${st.candidateCount??0}</b><small>참고 후보</small></div></div><div class="statusline"><span class="status-dot ${cl}"></span>${txt}<br>마지막 확인 ${kdt(st.lastCheckedAt)}</div></a>`}).join('');
 document.getElementById('app').innerHTML=`<div class="media-grid">${cards}</div><div class="notice"><b>출시 목록</b> · 위 숫자의 ‘실제 저장’ 기사만 매체 목록에 표시합니다. 300건 참고 후보는 수집·검토용으로만 보존하며 기사 목록에는 섞지 않습니다.</div>`;
}
function detail(id,page){
 const m=sources[id],st=data.states[id]||{},all=data.groups[id]||[],size=100,totalPages=Math.max(1,Math.ceil(all.length/size));page=Math.min(Math.max(1,page),totalPages);const start=(page-1)*size,items=all.slice(start,start+size);const [cl,txt]=statusInfo(st);
 const cards=items.map(r=>{const title=esc(r.title||'제목 확인 중');const photo=r.image?'<img alt="" src="'+esc(r.image.url||r.image)+'">':'대표사진 없음';const excerpt=r.excerpt?esc(r.excerpt):'';const imageFlag=r.imageState==='RIGHTS_NOT_CONFIRMED'?'사진 조건 미확인':r.imageState==='NO_STORED_IMAGE'?'사진 없음':!r.image?'사진 미표시':'';const excerptFlag=r.excerptState==='RIGHTS_NOT_CONFIRMED'?'소개글 조건 미확인':r.excerptState==='NO_STORED_EXCERPT'?'소개글 없음':!r.excerpt?'소개글 미표시':'';return `<a class="article" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"><div class="photo">${photo}</div><div class="article-body"><div class="meta"><span>${m.name}</span><span>${kdate(r.publishedAt)}</span></div><h3>${title}</h3><p class="excerpt">${excerpt}</p><div class="flags"><span class="flag actual">실제 저장</span>${imageFlag?'<span class="flag">'+imageFlag+'</span>':''}${excerptFlag?'<span class="flag">'+excerptFlag+'</span>':''}</div></div></a>`}).join('');
 const auto=st.automationStatus==='NOT_CONNECTED'?'자동수집 미연결':st.automationStatus==='RECENT_SCHEDULED_RUN_OBSERVED'?('최근 예약 실행 '+kdt(st.lastScheduledRunAt)+(st.lastScheduledRunStatus?' · '+(st.lastScheduledRunStatus==='SUCCESS'?'성공':esc(st.lastScheduledRunStatus)):'')):st.automaticRefresh?'최근 예약 실행 확인':'자동실행 미확인';document.getElementById('app').innerHTML=`<div class="toolbar"><a class="back" href="./">← 세 매체</a><div class="source-title">${m.name}</div><span class="pill dev">${all.length}건 · 100건/페이지</span></div><div class="statebox"><span class="status-dot ${cl}"></span><b>${txt}</b> · 실제 저장 ${st.actualCount??0}건 · 참고 후보 ${st.candidateCount??0}건(목록 비노출) · ${auto} · 마지막 확인 ${kdt(st.lastCheckedAt)}${st.nextAttemptAt?' · 다음 허용 '+kdt(st.nextAttemptAt):''}${st.lastError?' · 오류 '+esc(st.lastError):''}</div><div class="list">${cards||'<div class="empty">표시할 항목이 없습니다.</div>'}</div><div class="pager"><button id="prev" ${page<=1?'disabled':''}>이전</button><span>${page} / ${totalPages}</span><button id="next" ${page>=totalPages?'disabled':''}>다음</button></div>`;
 const go=n=>{const u=new URL(location.href);u.searchParams.set('source',m.slug);u.searchParams.set('page',String(n));location.href=u.href};
 document.getElementById('prev').onclick=()=>go(page-1);document.getElementById('next').onclick=()=>go(page+1);
}
async function boot(){
 try{const res=await fetch(API,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);data=await res.json();const p=new URLSearchParams(location.search),id=bySlug[p.get('source')];id?detail(id,Number(p.get('page')||1)):home()}catch(e){document.getElementById('app').innerHTML='<div class="empty"><b>뉴스 상태를 불러오지 못했습니다.</b><br>기존 수의통합관에는 영향을 주지 않습니다.</div>'}
}
boot();
</script></body></html>
